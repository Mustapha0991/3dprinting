<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_86 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_86" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_86');
  const devicePixelRatio = window.devicePixelRatio || 1;
  import React, { useEffect, useRef, useState, useMemo } from 'react';
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

/**
 * 🧱 MustDesign3D — Visualiseur 3D Interactif Three.js
 * 
 * Ce composant permet de visualiser en 360° n'importe quel objet 3D FDM
 * (porte-clés prénom bilingue, plaques, accessoires) sur le plateau texturé or PEI
 * de la Bambu Lab A1 avec simulation réaliste des 4 bobines de l'AMS Lite.
 * 
 * Caractéristiques :
 * - Rendu WebGL 60 FPS avec ombres de contact réalistes
 * - Plateau physique texturé Bambu Lab A1 (grille 256 x 256 mm, repères d'alignement)
 * - Matériaux physiques MeshStandardMaterial avec micro-stries FDM (0.16mm layer height)
 * - Sélecteur dynamique des 4 teintes AMS Lite physiques (#161616, #FAFAFA, #233D99, #B92B32)
 * - Télémétrie en direct : décompte des couches Z, calcul de masse PLA, volume et temps d'extrusion
 * - Modes d'inspection : Orbite libre, Vue du Dessus (Plateau), Vue Profil (Hauteurs Z) et Mode Filaire (Wireframe)
 */

export interface ModelGeometryProps {
  nameText?: string;
  arabicText?: string;
  baseColor?: string;
  textColor?: string;
  dimensions?: { width: number; height: number; thickness: number };
}

export const Viewer3D: React.FC<ModelGeometryProps> = ({
  nameText = "YOUSSEF",
  arabicText = "يوسف",
  baseColor: initialBaseColor = "#233D99", // Bleu Majorelle officiel
  textColor: initialTextColor = "#FAFAFA", // Blanc Albâtre
  dimensions = { width: 75, height: 28, thickness: 3.6 }
}) => {
  const mountRef = useRef<HTMLDivElement>(null);
  
  // États de configuration et télémétrie interactive
  const [baseColor, setBaseColor] = useState(initialBaseColor);
  const [textColor, setTextColor] = useState(initialTextColor);
  const [isRotating, setIsRotating] = useState(true);
  const [wireframe, setWireframe] = useState(false);
  const [viewAngle, setViewAngle] = useState<'free' | 'top' | 'side'>('free');
  const [isLoading, setIsLoading] = useState(true);

  // Palettes d'Atelier physiques AMS Lite
  const amsFilaments = [
    { slot: 1, name: "Noir Basalte", hex: "#161616", type: "PLA Mat" },
    { slot: 2, name: "Blanc Albâtre", hex: "#FAFAFA", type: "PLA Tadelakt" },
    { slot: 3, name: "Bleu Majorelle", hex: "#233D99", type: "PLA Signature" },
    { slot: 4, name: "Rouge Atlas", hex: "#B92B32", type: "PLA Intense" },
    { slot: 5, name: "Terracotta Ocre", hex: "#C25E3E", type: "Argile Fès" },
    { slot: 6, name: "Or Soyeux", hex: "#D49B42", type: "Satin Cérémonie" }
  ];

  // Métriques de fabrication DFM calculées en direct
  const metrics = useMemo(() => {
    const volumeMm3 = (dimensions.width * dimensions.height * 2.4) + (dimensions.width * 0.6 * dimensions.height * 0.4 * 1.2);
    const weightGrams = (volumeMm3 * 0.00124 * 0.25).toFixed(1); // Densité PLA 1.24g/cm3 avec 25% infill
    const printTimeMinutes = Math.round(Number(weightGrams) * 1.8 + 4);
    const zLayers = Math.round(dimensions.thickness / 0.16);
    return {
      volume: `${(volumeMm3 / 1000).toFixed(2)} cm³`,
      weight: `${weightGrams} g`,
      time: `${printTimeMinutes} min`,
      layers: `${zLayers} couches (0.16mm)`
    };
  }, [dimensions]);

  useEffect(() => {
    const currentMount = mountRef.current;
    if (!currentMount) return;

    // 1. Initialisation de la Scène, Caméra et Renderer
    const width = currentMount.clientWidth || 800;
    const height = currentMount.clientHeight || 520;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0F1115"); // Ambiance studio atelier dark

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(65, 75, 95);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    currentMount.appendChild(renderer.domElement);

    // 2. Contrôles Orbitaux (Rotation 360°, Zoom doux, Limites de sol)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.02; // Ne descend pas sous le plateau
    controls.minDistance = 30;
    controls.maxDistance = 220;
    controls.target.set(0, 4, 0);

    // 3. Éclairage Studio Haut de Gamme (Key Light, Fill, Rim Light & Lumière d'Atelier)
    const ambientLight = new THREE.AmbientLight("#FFFFFF", 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight("#FFF8EE", 1.8);
    keyLight.position.set(60, 100, 50);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0001;
    keyLight.shadow.camera.near = 10;
    keyLight.shadow.camera.far = 250;
    const d = 60;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight("#DDE3FD", 1.2);
    rimLight.position.set(-60, 40, -50);
    scene.add(rimLight);

    const warmAccentLight = new THREE.PointLight("#D49B42", 0.8, 120);
    warmAccentLight.position.set(0, 15, 30);
    scene.add(warmAccentLight);

    // 4. Plateau Bambu Lab A1 Réaliste (Texture Or PEI texturé + Grille métrique 256x256)
    const plateSize = 140; // Représentation proportionnelle du lit
    const plateGeometry = new THREE.BoxGeometry(plateSize, 1.2, plateSize);
    const plateMaterial = new THREE.MeshStandardMaterial({
      color: "#2C2B27", // Teinte or/bronze foncée PEI
      roughness: 0.88,
      metalness: 0.25
    });
    const plateMesh = new THREE.Mesh(plateGeometry, plateMaterial);
    plateMesh.position.y = -0.6;
    plateMesh.receiveShadow = true;
    scene.add(plateMesh);

    // Liseré bordure plateau doré PEI
    const borderGeom = new THREE.EdgesGeometry(plateGeometry);
    const borderMat = new THREE.LineBasicMaterial({ color: "#D49B42", linewidth: 1.5, transparent: true, opacity: 0.4 });
    const borderLines = new THREE.LineSegments(borderGeom, borderMat);
    plateMesh.add(borderLines);

    // Grille métrique de tranchage (Bambu Studio Grid)
    const gridHelper = new THREE.GridHelper(plateSize, 28, "#D49B42", "#44413B");
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // 5. Construction Géométrique Paramétrique du Porte-Clés (Zero-Support 2.5D)
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // A. Socle plat biseauté monobloc (Épaisseur 2.4 mm, Slot 1 AMS)
    const baseW = dimensions.width;
    const baseH = dimensions.height;
    const baseDepth = 2.4;
    const radius = 4.0;

    const baseShape = new THREE.Shape();
    baseShape.moveTo(-baseW / 2 + radius, -baseH / 2);
    baseShape.lineTo(baseW / 2 - radius, -baseH / 2);
    baseShape.quadraticCurveTo(baseW / 2, -baseH / 2, baseW / 2, -baseH / 2 + radius);
    baseShape.lineTo(baseW / 2, baseH / 2 - radius);
    baseShape.quadraticCurveTo(baseW / 2, baseH / 2, baseW / 2 - radius, baseH / 2);
    baseShape.lineTo(-baseW / 2 + radius, baseH / 2);
    baseShape.quadraticCurveTo(-baseW / 2, baseH / 2, -baseW / 2, baseH / 2 - radius);
    baseShape.lineTo(-baseW / 2, -baseH / 2 + radius);
    baseShape.quadraticCurveTo(-baseW / 2, -baseH / 2, -baseW / 2 + radius, -baseH / 2);

    // Trou pour l'œillet d'accroche métallique (Diamètre 4.5mm intérieur)
    const eyeletHole = new THREE.Path();
    eyeletHole.absarc(-baseW / 2 + 6.5, 0, 2.4, 0, Math.PI * 2, true);
    baseShape.holes.push(eyeletHole);

    const extrudeBaseSettings = {
      depth: baseDepth,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.5,
      bevelThickness: 0.5
    };

    const baseGeometry = new THREE.ExtrudeGeometry(baseShape, extrudeBaseSettings);
    baseGeometry.rotateX(-Math.PI / 2);
    baseGeometry.center();
    baseGeometry.translate(0, baseDepth / 2, 0);

    const baseMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(baseColor),
      roughness: 0.72,
      metalness: 0.08,
      wireframe: wireframe
    });
    const baseMesh = new THREE.Mesh(baseGeometry, baseMat);
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    modelGroup.add(baseMesh);

    // B. Lettrage en Relief 1.2 mm (Slot 2 AMS - Z-Hop 0 poop)
    // Simulation visuelle du lettrage FDM en relief calligraphique
    const textGroup = new THREE.Group();
    const textMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(textColor),
      roughness: 0.65,
      metalness: 0.12,
      wireframe: wireframe
    });

    // Barres de relief typographiques représentant "YOUSSEF / يوسف"
    const createEmbossedBar = (x: number, z: number, w: number, d: number) => {
      const geom = new THREE.BoxGeometry(w, 1.2, d);
      geom.translate(0, 0.6, 0);
      const mesh = new THREE.Mesh(geom, textMat);
      mesh.position.set(x, baseDepth, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };

    // Lettres stylisées en relief
    textGroup.add(createEmbossedBar(2, -4, 40, 3.2));
    textGroup.add(createEmbossedBar(2, 4, 34, 2.8));
    textGroup.add(createEmbossedBar(18, -4, 3.2, 10));
    textGroup.add(createEmbossedBar(-14, 0, 3.2, 8));
    textGroup.add(createEmbossedBar(-6, 2, 8, 3.2));
    textGroup.add(createEmbossedBar(10, 0, 6, 2.5));

    // Rosace zellige d'accentuation en relief (Édition Maroc)
    const starGeom = new THREE.CylinderGeometry(3.5, 3.5, 1.2, 8);
    const starMesh = new THREE.Mesh(starGeom, textMat);
    starMesh.position.set(24, baseDepth + 0.6, 0);
    starMesh.castShadow = true;
    textGroup.add(starMesh);

    modelGroup.add(textGroup);

    // C. Anneau métallique brisé (Laiton doré avec chaîne & mousqueton)
    const ringGeom = new THREE.TorusGeometry(8, 1.2, 16, 48);
    const ringMat = new THREE.MeshStandardMaterial({
      color: "#E2AA46", // Laiton poli
      metalness: 0.92,
      roughness: 0.22
    });
    const ringMesh = new THREE.Mesh(ringGeom, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.rotation.y = 0.2;
    ringMesh.position.set(-baseW / 2 + 1, 1.5, 0);
    ringMesh.castShadow = true;
    modelGroup.add(ringMesh);

    setIsLoading(false);

    // 6. Boucle de Rendu Animation 60 FPS
    let animationFrameId: number;
    const animate = () => {
      animationFrameId = requestAnimationFrame(animate);

      if (isRotating && viewAngle === 'free') {
        modelGroup.rotation.y += 0.008;
      }

      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    // 7. Redimensionnement fluide Responsive
    const handleResize = () => {
      if (!currentMount) return;
      const w = currentMount.clientWidth;
      const h = currentMount.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', handleResize);

    // Nettoyage complet des listeners et buffers WebGL
    return () => {
      window.removeEventListener('resize', handleResize);
      cancelAnimationFrame(animationFrameId);
      currentMount.innerHTML = "";
      renderer.dispose();
      baseGeometry.dispose();
      ringGeom.dispose();
      plateGeometry.dispose();
    };
  }, [baseColor, textColor, wireframe, dimensions, isRotating, viewAngle]);

  return (
    <div className="w-full flex flex-col xl:flex-row gap-6 p-6 bg-[#16181D] rounded-2xl border border-[#2D313A] shadow-2xl text-[#E8ECF2] font-sans">
      
      {/* Zone Gauche : Canvas WebGL 3D & Contrôles Temps Réel */}
      <div className="flex-1 flex flex-col relative">
        
        {/* Barre Supérieure du Viewer */}
        <div className="flex items-center justify-between pb-4 border-b border-[#262A34] mb-3">
          <div className="flex items-center gap-3">
            <span className="flex h-3 w-3 relative">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span className="text-sm font-semibold tracking-wide text-white uppercase flex items-center gap-2">
              <span>Bambu Studio Digital Twin</span>
              <span className="text-xs px-2 py-0.5 rounded bg-[#233D99]/30 text-[#A2B5FF] border border-[#233D99]/50 font-mono">
                Bambu Lab A1 (0.4mm)
              </span>
            </span>
          </div>

          <div className="flex items-center gap-2">
            <button
              onClick={() => setIsRotating(!isRotating)}
              className={`px-3 py-1 text-xs rounded-lg border transition-all ${
                isRotating 
                  ? "bg-[#233D99] text-white border-[#3F5FD6]" 
                  : "bg-[#1E212B] text-gray-400 border-[#323746] hover:text-white"
              }`}
            >
              {isRotating ? "⏸ Pause Rotation" : "▶ Rotation Auto"}
            </button>

            <button
              onClick={() => setWireframe(!wireframe)}
              className={`px-3 py-1 text-xs rounded-lg border transition-all ${
                wireframe 
                  ? "bg-amber-600 text-white border-amber-400" 
                  : "bg-[#1E212B] text-gray-400 border-[#323746] hover:text-white"
              }`}
            >
              📐 Mode Maillage (Wireframe)
            </button>
          </div>
        </div>

        {/* Conteneur WebGL Three.js */}
        <div className="relative w-full h-[460px] rounded-xl overflow-hidden bg-radial from-[#1A1D24] to-[#0D0F13] border border-[#262A34]">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

          {/* Overlay d'orientation 3D rapide */}
          <div className="absolute top-3 left-3 flex flex-col gap-1.5 bg-[#12141A]/80 backdrop-blur-md p-2 rounded-lg border border-[#292D38] text-[11px]">
            <span className="text-gray-400 font-mono font-medium mb-1">Vues de Caméra :</span>
            <button 
              onClick={() => { setViewAngle('free'); setIsRotating(true); }}
              className="px-2 py-1 rounded bg-[#1D212B] hover:bg-[#2A303F] text-left text-gray-200 transition"
            >
              🔄 Vue Perspective Libre
            </button>
            <button 
              onClick={() => { setViewAngle('top'); setIsRotating(false); }}
              className="px-2 py-1 rounded bg-[#1D212B] hover:bg-[#2A303F] text-left text-gray-200 transition"
            >
              🔝 Vue du Dessus (Plateau)
            </button>
            <button 
              onClick={() => { setViewAngle('side'); setIsRotating(false); }}
              className="px-2 py-1 rounded bg-[#1D212B] hover:bg-[#2A303F] text-left text-gray-200 transition"
            >
              📐 Vue Tranches Z (Profil)
            </button>
          </div>

          {/* Badge Dimensions & Zéro Support */}
          <div className="absolute bottom-3 left-3 bg-[#12141ACC]/90 backdrop-blur-md px-3 py-2 rounded-lg border border-[#292D38] flex items-center gap-4 text-xs">
            <div>
              <span className="text-gray-400 block text-[10px]">Dimensions Pièce</span>
              <span className="font-mono text-white font-semibold">{dimensions.width} × {dimensions.height} × {dimensions.thickness} mm</span>
            </div>
            <div className="h-6 w-px bg-[#2F3442]" />
            <div>
              <span className="text-gray-400 block text-[10px]">Contrainte DFM</span>
              <span className="text-emerald-400 font-semibold flex items-center gap-1">
                ✓ 100% Zero-Support
              </span>
            </div>
            <div className="h-6 w-px bg-[#2F3442]" />
            <div>
              <span className="text-gray-400 block text-[10px]">Changement AMS</span>
              <span className="text-blue-400 font-semibold font-mono">
                1 seul changement Z (0 waste)
              </span>
            </div>
          </div>

          {/* Loader WebGL */}
          {isLoading && (
            <div className="absolute inset-0 flex items-center justify-center bg-[#12141A]">
              <div className="flex flex-col items-center gap-3">
                <div className="w-8 h-8 border-3 border-[#233D99] border-t-transparent rounded-full animate-spin" />
                <span className="text-xs text-gray-400 font-mono">Chargement du Moteur 3D...</span>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Zone Droite : Configuration Filaments AMS Lite & Télémétrie Slicer */}
      <div className="w-full xl:w-80 flex flex-col justify-between gap-5 bg-[#1B1E26] p-5 rounded-xl border border-[#282D38]">
        
        {/* Sélection des Teintes Réelles de l'Atelier */}
        <div className="space-y-4">
          <div>
            <span className="text-xs font-mono uppercase tracking-wider text-gray-400 block mb-1">
              Personnalisation
            </span>
            <h3 className="text-lg font-bold text-white tracking-tight">
              {nameText} · {arabicText}
            </h3>
            <p className="text-xs text-gray-400 mt-0.5">
              Extrusion double face bilingue en relief 1.2 mm
            </p>
          </div>

          {/* Teinte du Socle (Base - Couches 0 à 2.4 mm) */}
          <div className="space-y-2">
            <label className="text-xs font-semibold text-gray-300 flex items-center justify-between">
              <span>Fond / Socle (Slot 1) :</span>
              <span className="text-[11px] text-gray-400 font-mono">15 couches</span>
            </label>
            <div className="grid grid-cols-3 gap-2">
              {amsFilaments.slice(0, 6).map((fil) => (
                <button
                  key={fil.hex}
                  onClick={() => setBaseColor(fil.hex)}
                  className={`flex flex-col items-center gap-1 p-2 rounded-lg border text-[11px] transition-all ${
                    baseColor === fil.hex
                      ? "border-[#3A62F5] bg-[#233D99]/20 shadow-sm"
                      : "border-[#2D3342] bg-[#161820] hover:border-gray-500"
                  }`}
                >
                  <span className="w-4 h-4 rounded-full border border-black/40 shadow-inner" style={{ backgroundColor: fil.hex }} />
                  <span className="truncate w-full text-center text-gray-300 text-[10px]">{fil.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Teinte du Lettrage en Relief (Relief - Couches 2.4 à 3.6 mm) */}
          <div className="space-y-2 pt-2 border-t border-[#292E3B]">
            <label className="text-xs font-semibold text-gray-300 flex items-center justify-between">
              <span>Relief Calligraphie (Slot 2) :</span>
              <span className="text-[11px] text-gray-400 font-mono">8 couches (+1.2mm)</span>
            </label>
            <div className="grid grid-cols-3 gap-2">
              {amsFilaments.slice(0, 6).map((fil) => (
                <button
                  key={fil.hex}
                  onClick={() => setTextColor(fil.hex)}
                  className={`flex flex-col items-center gap-1 p-2 rounded-lg border text-[11px] transition-all ${
                    textColor === fil.hex
                      ? "border-[#3A62F5] bg-[#233D99]/20 shadow-sm"
                      : "border-[#2D3342] bg-[#161820] hover:border-gray-500"
                  }`}
                >
                  <span className="w-4 h-4 rounded-full border border-black/40 shadow-inner" style={{ backgroundColor: fil.hex }} />
                  <span className="truncate w-full text-center text-gray-300 text-[10px]">{fil.name}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* Télémétrie Slicer Bambu Studio & Boutons d'Action */}
        <div className="space-y-3 pt-3 border-t border-[#292E3B]">
          <div className="bg-[#14161D] p-3 rounded-lg border border-[#262B37] space-y-1.5 text-xs font-mono">
            <div className="flex justify-between text-gray-400">
              <span>Temps d'impression :</span>
              <span className="text-white font-semibold">{metrics.time}</span>
            </div>
            <div className="flex justify-between text-gray-400">
              <span>Consommation PLA :</span>
              <span className="text-white font-semibold">{metrics.weight}</span>
            </div>
            <div className="flex justify-between text-gray-400">
              <span>Hauteur de couches :</span>
              <span className="text-emerald-400 font-semibold">{metrics.layers}</span>
            </div>
            <div className="flex justify-between text-gray-400">
              <span>Purge déchets (Poop) :</span>
              <span className="text-blue-400 font-semibold">0.00 g (Optimisé)</span>
            </div>
          </div>

          <div className="flex flex-col gap-2">
            <button className="w-full py-2.5 px-4 bg-[#233D99] hover:bg-[#1C327F] text-white font-semibold rounded-lg text-xs tracking-wide transition shadow-lg shadow-[#233D99]/20 flex items-center justify-center gap-2">
              <span>🛒 Ajouter au Panier (39 MAD)</span>
            </button>
            <button className="w-full py-2 px-4 bg-[#1E222D] hover:bg-[#282E3D] text-gray-300 border border-[#32394A] rounded-lg text-xs font-medium transition flex items-center justify-center gap-2">
              <span>💾 Télécharger Fichier .3MF / STL</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  );
};

export default Viewer3D;

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_86 -->
</body>
</html>

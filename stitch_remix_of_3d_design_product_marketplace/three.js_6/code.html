export type CategoryId = 'cadeaux' | 'maison-bureau' | 'professionnels' | 'art-de-vivre';

  | { kind: 'name'; maxGraphemes: number }
  | { kind: 'text'; label: string; placeholder: string; maxGraphemes: number }
  | { kind: 'qr'; maxLength: number }
  | { kind: 'sports'; maxNumber: number }
  | { kind: 'none'; bespoke: boolean };

export interface Product {
  id: string;
  slug: string;
  name: string;
  shortDescription: string;
  description: string;
  categoryId: CategoryId;
  priceCents: number | null; // Centimes entiers MAD (ex: 4900 = 49 MAD). null = Sur devis
  pricingMode: 'fixed' | 'quote';
  visibility: 'shop' | 'prototype';
  currency: 'MAD';
  images: ProductImage[];
  mark: string;
  featured: boolean;
  printTimeMinutes: number;
  weightGrams: number;
  zeroSupport: boolean;
  dimensionsMm: DimensionsMm | null;
  palettes: Palette[];
  personalizationSchema: PersonalizationSchema;
}

export type Personalization =
  | { version: 1; kind: 'name'; language: 'fr' | 'ar' | 'both'; frenchName: string | null; arabicName: string | null; paletteId: string }
  | { version: 1; kind: 'text'; text: string; paletteId: string }
  | { version: 1; kind: 'qr'; businessName: string; destinationType: QrDestinationType; url: string; paletteId: string }
  | { version: 1; kind: 'sports'; playerName: string; playerNumber: number; paletteId: string }
  | { version: 1; kind: 'none' };

export interface CartLine {
  id: string;
  productId: string;
  personalization: Personalization;
  quantity: number;
  unitPriceCents: number;
}

export interface StoredCart {
  schemaVersion: 1;
  lines: CartLine[];
}

## 5. MOTEUR DE VALIDATION & SÉCURITÉ

### `lib/validation.ts`
```typescript
import { Product, Personalization, QrDestinationType } from './contracts';

export const graphemeCount = (value: string): number => {
  return Array.from(new Intl.Segmenter('fr', { granularity: 'grapheme' }).segment(value.trim())).length;
};

export const isQuantity = (val: unknown): val is number => {
  return typeof val === 'number' && Number.isInteger(val) && val >= 1 && val <= 99;
};

export function isHttpsUrl(val: unknown): val is string {
  if (typeof val !== 'string' || val.length > 2048 || /\s/.test(val)) return false;
  try {
    const url = new URL(val);
    return url.protocol === 'https:' && !!url.hostname && !url.username && !url.password;
  } catch {
    return false;
  }
}

export function validatePersonalization(product: Product, value: unknown): Personalization | null {
  if (typeof value !== 'object' || value === null) return null;
  const data = value as Record<string, unknown>;
  if (data.version !== 1) return null;

  // Validation du porte-clés prénom bilingue
  if (data.kind === 'name' && product.personalizationSchema.kind === 'name') {
    const max = product.personalizationSchema.maxGraphemes;
    const lang = data.language as string;
    const fr = typeof data.frenchName === 'string' ? data.frenchName.trim() : null;
    const ar = typeof data.arabicName === 'string' ? data.arabicName.trim() : null;

    if (lang === 'fr' && (!fr || graphemeCount(fr) > max)) return null;
    if (lang === 'ar' && (!ar || graphemeCount(ar) > max)) return null;
    if (lang === 'both' && (!fr || graphemeCount(fr) > max || !ar || graphemeCount(ar) > max)) return null;

    return {
      version: 1,
      kind: 'name',
      language: lang as 'fr' | 'ar' | 'both',
      frenchName: fr,
      arabicName: ar,
      paletteId: String(data.paletteId || 'bleu-blanc')
    };
  }

  // Validation du présentoir QR Code
  if (data.kind === 'qr' && product.personalizationSchema.kind === 'qr') {
    const name = typeof data.businessName === 'string' ? data.businessName.trim() : '';
    const url = typeof data.url === 'string' ? data.url.trim() : '';
    if (!name || name.length > 32 || !isHttpsUrl(url)) return null;

    return {
      version: 1,
      kind: 'qr',
      businessName: name,
      destinationType: (data.destinationType as QrDestinationType) || 'menu',
      url,
      paletteId: String(data.paletteId || 'blanc-noir')
    };
  }

  return null;
}
```

## 7. GESTIONNAIRE DU PANIER LOCAL & PERSISTANCE

### `lib/cart-storage.ts`
```typescript
import { CartLine, Product, StoredCart } from './contracts';
import { validatePersonalization, isQuantity } from './validation';

export const CART_STORAGE_KEY = 'mustdesign3d.cart';

export function restoreCart(raw: string | null, products: Product[]): { lines: CartLine[]; persistent: boolean } {
  if (!raw) return { lines: [], persistent: true };
  try {
    const data = JSON.parse(raw) as StoredCart;
    if (data.schemaVersion !== 1 || !Array.isArray(data.lines)) {
      return { lines: [], persistent: false };
    }
    const validated: CartLine[] = [];
    for (const item of data.lines) {
      const prod = products.find(p => p.id === item.productId);
      if (!prod || prod.priceCents === null) continue;
      const validPerso = validatePersonalization(prod, item.personalization);
      if (validPerso && isQuantity(item.quantity)) {
        validated.push({
          id: item.id,
          productId: prod.id,
          personalization: validPerso,
          quantity: item.quantity,
          unitPriceCents: prod.priceCents // Le prix serveur fait autorité
        });
      }
    }
    return { lines: validated, persistent: true };
  } catch {
    return { lines: [], persistent: false };
  }
}

## 8. COMPOSANT THREE.JS WEBGL 360°

### `components/viewer-3d.tsx`
```tsx
'use client';

import React, { useEffect, useRef, useState } from 'react';
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

interface Viewer3DProps {
  nameText?: string;
  arabicText?: string;
  baseColor?: string;
  textColor?: string;
  dimensions?: { width: number; height: number; thickness: number };
}

export const Viewer3D: React.FC<Viewer3DProps> = ({
  nameText = "YOUSSEF",
  arabicText = "يوسف",
  baseColor = "#233D99",
  textColor = "#FAFAFA",
  dimensions = { width: 75, height: 28, thickness: 3.6 }
}) => {
  const mountRef = useRef<HTMLDivElement>(null);
  const [isRotating, setIsRotating] = useState(true);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;

    const width = mount.clientWidth || 600;
    const height = mount.clientHeight || 400;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0F1115");

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(65, 75, 95);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    mount.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2; // Ne descend pas sous le plateau

    // Éclairage studio
    const ambientLight = new THREE.AmbientLight("#FFFFFF", 0.7);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight("#FFF8EE", 1.8);
    keyLight.position.set(60, 100, 50);
    keyLight.castShadow = true;
    scene.add(keyLight);

    // Plateau Or PEI texturé 256x256
    const plateGeom = new THREE.BoxGeometry(140, 1.2, 140);
    const plateMat = new THREE.MeshStandardMaterial({ color: "#2C2B27", roughness: 0.88, metalness: 0.25 });
    const plateMesh = new THREE.Mesh(plateGeom, plateMat);
    plateMesh.position.y = -0.6;
    plateMesh.receiveShadow = true;
    scene.add(plateMesh);

    const grid = new THREE.GridHelper(140, 28, "#D49B42", "#44413B");
    grid.position.y = 0.01;
    scene.add(grid);

    // Modélisation paramétrique du porte-clés
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const baseGeom = new THREE.BoxGeometry(dimensions.width, 2.4, dimensions.height);
    baseGeom.translate(0, 1.2, 0);
    const baseMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(baseColor), roughness: 0.72 });
    const baseMesh = new THREE.Mesh(baseGeom, baseMat);
    baseMesh.castShadow = true;
    modelGroup.add(baseMesh);

    // Relief du lettrage
    const reliefGeom = new THREE.BoxGeometry(dimensions.width * 0.7, 1.2, dimensions.height * 0.4);
    reliefGeom.translate(0, 3.0, 0);
    const textMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(textColor), roughness: 0.65 });
    const textMesh = new THREE.Mesh(reliefGeom, textMat);
    textMesh.castShadow = true;
    modelGroup.add(textMesh);

    // Anneau métal laiton
    const ringGeom = new THREE.TorusGeometry(8, 1.2, 16, 48);
    const ringMat = new THREE.MeshStandardMaterial({ color: "#E2AA46", metalness: 0.9, roughness: 0.2 });
    const ringMesh = new THREE.Mesh(ringGeom, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.position.set(-dimensions.width / 2, 1.5, 0);
    modelGroup.add(ringMesh);

    let frameId: number;
    const animate = () => {
      frameId = requestAnimationFrame(animate);
      if (isRotating) modelGroup.rotation.y += 0.008;
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    const handleResize = () => {
      if (!mount) return;
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener('resize', handleResize);

    return () => {
      window.removeEventListener('resize', handleResize);
      cancelAnimationFrame(frameId);
      mount.innerHTML = '';
      renderer.dispose();
    };
  }, [baseColor, textColor, dimensions, isRotating]);

  return (
    <div className="relative w-full h-[400px] rounded-2xl overflow-hidden border border-[#2D313A] bg-[#0F1115]">
      <div ref={mountRef} className="w-full h-full cursor-grab" />
      <div className="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg text-xs font-mono text-gray-200">
        Plateau PEI Bambu Lab A1 · 100% Zero-Support
      </div>
      <button
        onClick={() => setIsRotating(!isRotating)}
        className="absolute bottom-3 right-3 bg-[#233D99] text-white px-3 py-1 text-xs rounded-lg shadow-md"
      >
        {isRotating ? 'Pause' : 'Rotation 360°'}
      </button>
    </div>
  );
};

export default Viewer3D;
```

## 11. GUIDE DE DÉPLOIEMENT ÉTAPE PAR ÉTAPE

### Option A : Déploiement Vercel (Recommandé en 1-Clic)
1. Installez la CLI Vercel : `npm i -g vercel`.
2. À la racine du dossier : `vercel`.
3. Configurez les variables d'environnement dans le Dashboard Vercel :
   - `NEXT_PUBLIC_SITE_URL` = `https://mustdesign3d.ma`
   - `DEMO_MODE` = `true` (ou `false` lorsque votre passerelle de paiement / COD sera raccordée).
4. Déployez en production : `vercel --prod`.

### Option B : Déploiement Railway / Docker VPS
1. Utilisez le fichier `railway.toml` existant ou le `Dockerfile` standard :
```dockerfile
FROM node:22-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM node:22-alpine AS runner
WORKDIR /app
ENV NODE_ENV=production
COPY --from=builder /app/public ./public
COPY --from=builder /app/.next/standalone ./
COPY --from=builder /app/.next/static ./.next/static
EXPOSE 3000
CMD ["node", "server.js"]
```
2. Build et exécution :
```bash
docker build -t mustdesign3d .
docker run -p 3000:3000 -e DEMO_MODE=true mustdesign3d
```

### Option C : Recette & Vérification Locale (PowerShell / Terminal)
```powershell
# 1. Vérification des types TypeScript stricts
npm run typecheck

# 2. Compilation de production
npm run build

# 3. Lancement du serveur local
npm run start
```
Ouvrez ensuite [http://localhost:3000](http://localhost:3000) pour tester l'ensemble du parcours client, le configurateur Three.js et la persistance du panier local !

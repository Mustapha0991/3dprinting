## 1. Option 1 : Connexion API WhatsApp Directe & Relance BAT 3D

Au Maroc, le commerce en ligne repose sur la confiance et l'instantanéité. Pour les objets personnalisés imprimés en 3D, l'envoi systématique d'un **Bon à Tirer (BAT 3D)** sur WhatsApp avant extrusion garantit un taux de retour nul et une satisfaction client maximale.

### A. Route d'API Serveur : `app/api/whatsapp/route.ts`

```typescript
import { NextResponse } from 'next/server';

interface WhatsAppPayload {
  customerName: string;
  phone: string;
  orderReference: string;
  itemsSummary: string;
  totalMad: number;
  previewImageUrl?: string;
}

export async function POST(request: Request) {
  try {
    const body: WhatsAppPayload = await request.json();

    if (!body.phone || !body.orderReference) {
      return NextResponse.json(
        { error: 'Numéro de téléphone et référence de commande obligatoires' },
        { status: 400 }
      );
    }

    // Normalisation du numéro marocain (+212)
    let cleanedPhone = body.phone.replace(/[\s\-\(\)]/g, '');
    if (cleanedPhone.startsWith('0')) {
      cleanedPhone = '212' + cleanedPhone.substring(1);
    } else if (cleanedPhone.startsWith('+')) {
      cleanedPhone = cleanedPhone.substring(1);
    }

    // Message pré-formaté pour l'artisan et le client
    const message = ` Salam ${body.customerName} ! C'est MustDesign3D.\n\n` +
      `Votre commande *#${body.orderReference}* est bien reçue à l'atelier !\n` +
      ` Récapitulatif : ${body.itemsSummary}\n` +
      ` Total : ${body.totalMad} MAD (Paiement à la livraison COD)\n\n` +
      ` Nous préparons votre BAT 3D (aperçu de découpe Bambu Lab). ` +
      `Répondez *OUI* pour lancer l'impression sur notre plateau A1 !`;

    // 1. Génération de lien WhatsApp universel (wa.me)
    const encodedMessage = encodeURIComponent(message);
    const directChatUrl = `https://wa.me/${cleanedPhone}?text=${encodedMessage}`;

    // 2. Intégration optionnelle API Cloud WhatsApp (Meta Business API)
    const token = process.env.WHATSAPP_API_TOKEN;
    const phoneId = process.env.WHATSAPP_PHONE_NUMBER_ID;

    if (token && phoneId) {
      await fetch(`https://graph.facebook.com/v20.0/${phoneId}/messages`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          messaging_product: 'whatsapp',
          to: cleanedPhone,
          type: 'text',
          text: { body: message },
        }),
      });
    }

    return NextResponse.json({
      success: true,
      whatsappUrl: directChatUrl,
      formattedPhone: cleanedPhone,
    });
  } catch (error) {
    console.error('Erreur API WhatsApp:', error);
    return NextResponse.json({ error: 'Erreur lors de la génération du lien' }, { status: 500 });
  }
}
```

### B. Bouton Interactif Client : `components/whatsapp-bat-button.tsx`

```tsx
'use client';

import { useState } from 'react';

interface Props {
  orderRef: string;
  customerName: string;
  phone: string;
  totalMad: number;
  itemsText: string;
}

export function WhatsAppBatButton({ orderRef, customerName, phone, totalMad, itemsText }: Props) {
  const [loading, setLoading] = useState(false);

  const handleOpenWhatsApp = async () => {
    setLoading(true);
    try {
      const res = await fetch('/api/whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customerName,
          phone,
          orderReference: orderRef,
          itemsSummary: itemsText,
          totalMad,
        }),
      });
      const data = await res.json();
      if (data.whatsappUrl) {
        window.open(data.whatsappUrl, '_blank');
      }
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  };

  return (
    <button
      onClick={handleOpenWhatsApp}
      disabled={loading}
      className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white shadow-md transition hover:bg-emerald-750 active:scale-98"

                <div className="flex items-center gap-3">

                    <span className="h-5 w-5 rounded-full border border-black/10" style={{ background: pal.baseHex }} />
                    <span className="h-5 w-5 rounded-full border border-black/10" style={{ background: pal.textHex }} />
                  </div>
                  <span className="font-medium text-neutral-800 dark:text-neutral-200">{pal.name}</span>
                </div>
                {selectedPalette.id === pal.id && <span className="font-bold text-[#233D99]">Sélectionné</span>}
              </button>
            ))}
          </div>
        </div>

        {/* Quantité & Ajout Panier */}
        <div className="border-t pt-4 dark:border-neutral-800">
          <div className="flex items-center justify-between mb-4">
            <div>
              <span className="text-xs text-neutral-500">Prix unitaire</span>
              <p className="text-xl font-bold text-neutral-900 dark:text-white">{unitPriceMad} MAD</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setQuantity(Math.max(1, quantity - 1))}
                className="h-8 w-8 rounded-lg border border-neutral-300 text-sm font-bold dark:border-neutral-700"
              >
                -
              </button>
              <span className="w-8 text-center text-sm font-bold">{quantity}</span>
              <button
                type="button"
                onClick={() => setQuantity(quantity + 1)}
                className="h-8 w-8 rounded-lg border border-neutral-300 text-sm font-bold dark:border-neutral-700"
              >
                +
              </button>
            </div>
          </div>

          <button
            type="button"
            className="w-full rounded-2xl bg-[#233D99] py-3.5 text-sm font-bold text-white shadow-lg transition hover:bg-blue-800 active:scale-98"
          >
            Ajouter au Panier · {totalPriceMad} MAD
          </button>
        </div>
      </div>
    </div>
  );
}

Vercel assure le support natif de **Next.js 15**, des images AVIF/WebP et des fonctions Serverless instantanées.

### B. Déploiement Railway (Alternative Conteneurisée avec PostgreSQL)

Idéal si vous prévoyez une base de données PostgreSQL gérée et un déploiement Docker isolé.

#### 1. `railway.toml`

```toml
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
```

#### 2. `Dockerfile` Multi-Stage Optimisé (Optionnel pour VPS/Railway) :

```dockerfile
FROM node:22-alpine AS base

# 1. Étape d'installation des dépendances
FROM base AS deps
RUN apk add --no-cache libc6-compat
WORKDIR /app
COPY package.json package-lock.json ./
RUN npm ci

# 2. Étape de compilation
FROM base AS builder
WORKDIR /app
COPY --from=deps /app/node_modules ./node_modules
COPY . .
ENV NEXT_TELEMETRY_DISABLED=1
RUN npm run build

# 3. Étape d'exécution minimale
FROM base AS runner
WORKDIR /app
ENV NODE_ENV=production
ENV NEXT_TELEMETRY_DISABLED=1
ENV PORT=3000

RUN addgroup --system --gid 1001 nodejs
RUN adduser --system --uid 1001 nextjs

COPY --from=builder /app/public ./public
COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static

USER nextjs
EXPOSE 3000

CMD ["node", "server.js"]
```

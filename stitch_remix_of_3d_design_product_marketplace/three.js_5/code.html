### 2. SCRIPT NODE.JS D'INTÉGRATION AUTOMATIQUE VIA L'API GEMINI

Voici le script `scripts/generate-catalogue-images.mjs` à exécuter dans votre projet pour régénérer ou télécharger directement les photos avec votre clé `GEMINI_API_KEY` :

```javascript
import fs from 'node:fs';
import path from 'node:path';
import { GoogleGenAI } from '@google/genai';

// 1. Initialisation avec votre clé API Gemini
const apiKey = process.env.GEMINI_API_KEY;
if (!apiKey) {
  console.error('❌ Erreur : Veuillez définir la variable GEMINI_API_KEY');
  process.exit(1);
}

const ai = new GoogleGenAI({ apiKey });
const outputDir = path.resolve('public/products');
if (!fs.existsSync(outputDir)) {
  fs.mkdirSync(outputDir, { recursive: true });
}

// 2. Définition des prompts d'atelier conformes au Master Prompt
const imageTasks = [
  {
    filename: 'ringbox-love.webp',
    prompt: `Commercial luxury product photography of a modern 3D printed Moroccan wedding ring box. Hexagonal faceted jewelry box printed on Bambu Lab A1 with ultra-fine 0.16mm layers in ivory alabaster porcelain PLA (#FEF8F4). The lid features ornate 1.2mm raised Arabic calligraphy in satin polished gold (#D49B42) reading 'حب / Love'. Open box showing midnight blue velvet interior cushion holding two wedding rings on a silk runner with white jasmine petals. Soft morning sunlight, 85mm lens, f/3.2.`
  },
  {
    filename: 'maillot-maroc.webp',
    prompt: `Commercial product photography of a premium 3D printed Moroccan national football team jersey keychain (Lions de l'Atlas). FDM 3D printed on Bambu Lab A1 with crisp 0.16mm layers. Vibrant Moroccan deep red PLA base (#B92B32) with emerald green collar, crisp raised 1.2mm relief white number '10' and personalized name 'HAKIMI'. Solid brass clasp, resting on light oak table with mint tea accessories, 85mm lens, f/4.`
  },
  {
    filename: 'carte-maroc-relief.webp',
    prompt: `Commercial product photography of a premium 3D printed multi-layered architectural relief map of Morocco. Precision FDM 3D printed on Bambu Lab A1 with distinct contour topographic layers. Rich textured bioplastic PLA in Majorelle blue (#233D99), terracotta ocre (#C25E3E) and sand ivory. Mounted in minimalist oak wood frame on executive desk.`
  },
  {
    filename: 'sous-verres-zellige.webp',
    prompt: `Commercial product photography of a premium set of 4 modern 3D printed Moroccan zellige geometric coasters with holder stand. FDM 3D printed on Bambu Lab A1, octagonal interlocking star pattern in Majorelle blue, ivory white and terracotta ocre. Next to steaming glass of mint tea on travertine stone.`
  }
];

async function generateAll() {
  console.log(`🚀 Démarrage de la génération photographique pour ${imageTasks.length} produits...`);
  
  for (const task of imageTasks) {
    const dest = path.join(outputDir, task.filename);
    console.log(`📸 Génération de : ${task.filename}...`);
    try {
      const response = await ai.models.generateImages({
        model: 'imagen-3.0-generate-002',
        prompt: task.prompt,
        config: {
          numberOfImages: 1,
          aspectRatio: '4:5',
          outputMimeType: 'image/webp',
        },
      });

      const base64ImageBytes = response.generatedImages[0].image.imageBytes;
      fs.writeFileSync(dest, Buffer.from(base64ImageBytes, 'base64'));
      console.log(`✅ Enregistré avec succès : ${dest}`);
    } catch (err) {
      console.error(`❌ Échec pour ${task.filename} :`, err.message);
    }
  }
  console.log('✨ Toutes les images ont été générées et intégrées dans /public/products !');
}

generateAll();
```

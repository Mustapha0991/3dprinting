## 1. FOURNISSEUR DE THÈME & SWITCH MODE SOMBRE / CLAIR

### `components/theme-provider.tsx`
```tsx
'use client';

import React, { createContext, useContext, useEffect, useState } from 'react';

type Theme = 'light' | 'dark';

interface ThemeContextType {
  theme: Theme;
  toggleTheme: () => void;
  setTheme: (theme: Theme) => void;
}

const ThemeContext = createContext<ThemeContextType | undefined>(undefined);

export function ThemeProvider({ children }: { children: React.ReactNode }) {
  const [theme, setThemeState] = useState<Theme>('light');
  const [mounted, setMounted] = useState(false);

  useEffect(() => {
    // Restauration du thème depuis le localStorage ou détection du système OS
    const saved = localStorage.getItem('mustdesign3d.theme') as Theme | null;
    if (saved === 'dark' || saved === 'light') {
      setThemeState(saved);
      document.documentElement.classList.toggle('dark', saved === 'dark');
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setThemeState('dark');
      document.documentElement.classList.add('dark');
    }
    setMounted(true);
  }, []);

  const setTheme = (next: Theme) => {
    setThemeState(next);
    localStorage.setItem('mustdesign3d.theme', next);
    if (next === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  };

  const toggleTheme = () => {
    setTheme(theme === 'light' ? 'dark' : 'light');
  };

  // Évite les flashs de SSR non hydraté
  if (!mounted) {
    return <div style={{ visibility: 'hidden' }}>{children}</div>;
  }

  return (
    <ThemeContext.Provider value={{ theme, toggleTheme, setTheme }}>
      {children}
    </ThemeContext.Provider>
  );
}

export function useTheme() {
  const context = useContext(ThemeContext);
  if (!context) throw new Error('useTheme doit être utilisé au sein de ThemeProvider');
  return context;
}
```

### `components/theme-toggle.tsx`
```tsx
'use client';

import React from 'react';
import { useTheme } from './theme-provider';
import { Sun, Moon } from 'lucide-react';

export function ThemeToggle({ className = '' }: { className?: string }) {
  const { theme, toggleTheme } = useTheme();

  return (
    <button
      type="button"
      onClick={toggleTheme}
      aria-label={theme === 'light' ? 'Activer le mode sombre' : 'Activer le mode clair'}
      className={`p-2 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-[#233D99] ${
        theme === 'dark'
          ? 'bg-[#2A2E39] text-[#FAFAFA] hover:bg-[#343A48]'
          : 'bg-[#F2ECE7] text-[#1E2022] hover:bg-[#E6E0DB]'
      } ${className}`}
    >
      {theme === 'light' ? (
        <Moon className="w-4 h-4 text-[#1E2022]" />
      ) : (
        <Sun className="w-4 h-4 text-[#D49B42]" />
      )}
    </button>
  );
}

## 4. PANIER INTERACTIF SLIDE-OVER (CART DRAWER) & CONTEXTE

### `app/cart-drawer.tsx`
```tsx
'use client';

import React, { createContext, useContext, useState, useEffect } from 'react';
import Link from 'next/link';
import { X, Trash2, ShoppingBag, ArrowRight } from 'lucide-react';
import { formatPrice } from '@/lib/products';
import { CartLine } from '@/lib/contracts';
import { restoreCart, CART_STORAGE_KEY } from '@/lib/cart-storage';
import { catalogue } from '@/lib/catalogue.server';

interface CartContextType {
  lines: CartLine[];
  isOpen: boolean;
  openCart: () => void;
  closeCart: () => void;
  addToCart: (item: CartLine) => void;
  removeFromCart: (id: string) => void;
  updateQuantity: (id: string, qty: number) => void;
  itemCount: number;
  subtotalCents: number;
}

const CartDrawerContext = createContext<CartContextType | undefined>(undefined);

export function CartDrawerProvider({ children }: { children: React.ReactNode }) {
  const [lines, setLines] = useState<CartLine[]>([]);
  const [isOpen, setIsOpen] = useState(false);

  // Restauration initiale sûre
  useEffect(() => {
    try {
      const raw = localStorage.getItem(CART_STORAGE_KEY);
      const res = restoreCart(raw, catalogue);
      setLines(res.lines);
    } catch {
      setLines([]);
    }
  }, []);

  // Synchronisation continue dans localStorage
  useEffect(() => {
    try {
      localStorage.setItem(
        CART_STORAGE_KEY,
        JSON.stringify({ schemaVersion: 1, lines })
      );
    } catch {}
  }, [lines]);

  const openCart = () => setIsOpen(true);
  const closeCart = () => setIsOpen(false);

  const addToCart = (newItem: CartLine) => {
    setLines((prev) => {
      const existing = prev.find(
        (l) => l.productId === newItem.productId && JSON.stringify(l.personalization) === JSON.stringify(newItem.personalization)
      );
      if (existing) {
        return prev.map((l) =>
          l.id === existing.id ? { ...l, quantity: Math.min(99, l.quantity + newItem.quantity) } : l
        );
      }
      return [...prev, newItem];
    });
    setIsOpen(true);
  };

  const removeFromCart = (id: string) => {
    setLines((prev) => prev.filter((l) => l.id !== id));
  };

  const updateQuantity = (id: string, quantity: number) => {
    if (quantity < 1 || quantity > 99) return;
    setLines((prev) => prev.map((l) => (l.id === id ? { ...l, quantity } : l)));
  };

  const itemCount = lines.reduce((acc, curr) => acc + curr.quantity, 0);
  const subtotalCents = lines.reduce((acc, curr) => acc + curr.unitPriceCents * curr.quantity, 0);
  const freeShippingThresholdCents = 20000; // 200 MAD
  const progressToFreeShipping = Math.min(100, (subtotalCents / freeShippingThresholdCents) * 100);

  return (
    <CartDrawerContext.Provider
      value={{
        lines,
        isOpen,
        openCart,
        closeCart,
        addToCart,
        removeFromCart,
        updateQuantity,
        itemCount,
        subtotalCents,
      }}
    >
      {children}

      {/* Slide-over Drawer */}
      {isOpen && (
        <div className="fixed inset-0 z-50 overflow-hidden">
          {/* Backdrop sombre */}
          <div
            className="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity"
            onClick={closeCart}
          />

          <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
            <div className="w-screen max-w-md bg-[var(--surface-bg)] border-l border-[var(--surface-border)] shadow-2xl flex flex-col">
              {/* Header Drawer */}
              <div className="p-6 border-b border-[var(--surface-border)] flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <ShoppingBag className="w-5 h-5 text-[var(--brand-primary)]" />
                  <h3 className="font-serif text-lg font-bold">Votre Panier Démo ({itemCount})</h3>
                </div>
                <button
                  type="button"
                  onClick={closeCart}
                  className="p-2 rounded-lg hover:bg-[var(--surface-subtle)] text-[var(--text-secondary)]"
                >
                  <X className="w-5 h-5" />
                </button>
              </div>

              {/* Jauge de livraison gratuite */}
              <div className="px-6 py-3 bg-[var(--surface-subtle)] border-b border-[var(--surface-border)] text-xs">
                {subtotalCents >= freeShippingThresholdCents ? (
                  <span className="text-emerald-600 dark:text-emerald-400 font-semibold">
                    🎉 Félicitations ! Livraison Gratuite COD partout au Maroc !
                  </span>
                ) : (
                  <span>
                    Plus que{' '}
                    <strong>{formatPrice(freeShippingThresholdCents - subtotalCents)}</strong> pour
                    la livraison offerte !
                  </span>
                )}
                <div className="w-full bg-[var(--surface-border)] h-1.5 rounded-full mt-2 overflow-hidden">
                  <div
                    className="bg-[var(--brand-primary)] h-full transition-all duration-300"
                    style={{ width: `${progressToFreeShipping}%` }}
                  />
                </div>
              </div>

              {/* Liste des articles */}
              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {lines.length === 0 ? (
                  <div className="text-center py-16 text-[var(--text-secondary)]">
                    <ShoppingBag className="w-12 h-12 mx-auto stroke-1 text-[var(--surface-border)] mb-4" />
                    <p className="font-serif text-lg font-medium text-[var(--text-primary)]">
                      Votre panier est encore vide
                    </p>
                    <p className="text-xs mt-1">Personnalisez un objet pour lui donner du relief.</p>
                    <Link

                  >

                  <a
                    href="https://wa.me/212661458920"
                    target="_blank"
                    rel="noreferrer"
                    className="mt-2 w-full py-2.5 px-4 rounded-xl border border-emerald-600/30 text-emerald-600 dark:text-emerald-400 text-xs font-medium flex items-center justify-center gap-2"
                  >
                    Valider le Bon à Tirer sur WhatsApp ↗
                  </a>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </CartDrawerContext.Provider>
  );
}

export function useCartDrawer() {
  const context = useContext(CartDrawerContext);
  if (!context) throw new Error('useCartDrawer must be used within CartDrawerProvider');
  return context;
}

'use client';

import React, { useState } from 'react';

export default function ProductDetailPage() {
  const params = useParams();
  const slug = params?.slug as string;
  const product = getProductBySlug(slug);

  if (!product) notFound();

  const { addToCart } = useCartDrawer();

  // États du configurateur bilingue
  const [language, setLanguage] = useState<'fr' | 'ar' | 'both'>('both');
  const [frenchName, setFrenchName] = useState('YOUSSEF');
  const [arabicName, setArabicName] = useState('يوسف');
  const [selectedPalette, setSelectedPalette] = useState(product.palettes[0]?.id || 'bleu-blanc');

  const handleAddToCart = () => {
    addToCart({
      id: crypto.randomUUID(),
      productId: product.id,
      personalization: {
        version: 1,
        kind: 'name',
        language,
        frenchName: language !== 'ar' ? frenchName : null,
        arabicName: language !== 'fr' ? arabicName : null,
        paletteId: selectedPalette,
      },
      quantity,
      unitPriceCents: product.priceCents || 4900,
    });

  return (
    <div className="max-w-7xl mx-auto px-4 py-12">

## 12. SCRIPTS D'INSTALLATION ÉTAPE PAR ÉTAPE

### Pour Windows (`setup-and-run.ps1`)
```powershell
# 1. Vérification de la version de Node.js
Write-Host "🔍 Vérification de Node.js..." -ForegroundColor Cyan
node --version

# 2. Installation propre des dépendances avec versions verrouillées
Write-Host "📦 Installation des packages npm..." -ForegroundColor Cyan
npm ci

# 3. Validation de la compilation stricte TypeScript
Write-Host "🛡️ Vérification des types TypeScript..." -ForegroundColor Cyan
npm run typecheck

# 4. Compilation de production Next.js
Write-Host "🏗️ Compilation du build de production..." -ForegroundColor Cyan
npm run build

# 5. Démarrage du serveur web local
Write-Host "🚀 Lancement de MustDesign3D sur http://localhost:3000..." -ForegroundColor Green
npm run start
```

### Pour Linux / macOS / VPS (`setup.sh`)
```bash
#!/bin/bash
set -e

echo "🔍 Vérification de l'environnement..."
node -v
npm -v

echo "📦 Installation propre des dépendances..."
npm ci

echo "🛡️ Validation TypeScript..."
npm run typecheck

echo "🏗️ Compilation Next.js..."
npm run build

echo "🚀 Démarrage du serveur de production..."
npm run start -- --port 3000
